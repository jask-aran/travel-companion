# Copy to config/trip.local.yaml (gitignored), or let `pnpm trip:init` write it.
# Only trip.wanderlogId is required.

trip:
  wanderlogId: YOUR_WANDERLOG_TRIP_ID   # from wanderlog.com/plan/<id>/...; the whole URL works too
  # publicId: trip                      # slug for output paths, storage keys and data/trips/<publicId>/

# share:
#   passphrase: ""        # encrypts the published trip; empty publishes plaintext

# Optional server keys, stored as Cloudflare secrets; the local pull uses none.
# `pnpm trip:keys` tests them and changes them here and on Cloudflare.
# google:
#   apiKey: ""            # billing on; enable Places API (New), Maps Static API, Routes API, Cloud Translation API
#   projectNumber: ""     # same project's number (digits): line and town names use the Translation LLM
#   browserApiKey: ""     # separate public key: Maps JavaScript API, billing enabled, website referrer restrictions
#   mapId: DEMO_MAP_ID    # optional Google map ID for Advanced Markers; Google's demo map is the default
# Restrict browserApiKey to your live origin and http://localhost:5173/*; never reuse apiKey.
# Browser map settings enter the app at build time, so run `pnpm ship` after changing them.
# GOOGLE_MAPS_BROWSER_KEY can supply the public browser key in a build environment.

# navitime:
#   apiKey: ""            # RapidAPI key subscribed to NAVITIME's route API (navitime-route-totalnavi): times in Japan

# site:
#   base: /                             # TRIP_BASE overrides it
#   origin: https://trips.example.com   # live site, for dev proxying and the post-deploy check; TRIP_ORIGIN overrides it

# cloudflare:             # filled in by the deploy step of `pnpm trip:init`
#   project: my-pages-project
#   kvNamespaceId: ""
#   mediaBucket: ""       # R2 bucket for photos and maps; without it they are off
#   accountId: ""         # needed when your login has several accounts
#   apiToken: ""          # instead of `wrangler login`; passed to wrangler as CLOUDFLARE_API_TOKEN
#   connectorOnly: true   # only the hosted connector, no app: `pnpm ship` uploads the function alone

# wanderlog:
#   api:
#     timeoutMs: 60000

# paths:
#   rawJson: private-import/wanderlog-trip.json
#   overrides: private-import/overrides.yaml
#   workingBundle: public-data/trips/trip/working.json   # default uses <publicId>
#   report: private-import/import-report.json
